<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Organize dados de Miner details em uma tabela clara.">
  <title>Miner Details — Organizador</title>
  <link rel="stylesheet" href="./styles.css?v=7">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand-mark" aria-hidden="true">M</div>
      <div>
        <p class="eyebrow">ORGANIZADOR DE DADOS</p>
        <h1>Miner Details</h1>
      </div>
    </header>

    <section class="workspace" aria-labelledby="input-title">
      <div class="section-heading">
        <div>
          <h2 id="input-title">Cole os dados dos itens</h2>
          <p>Cada ocorrência de <strong>Miner details</strong> inicia um item. O nome vem após <strong>Miner details open</strong>, sozinho ou seguido por um número de 1 a 5.</p>
        </div>
        <span class="privacy-badge">Processado no navegador</span>
      </div>

      <label class="sr-only" for="raw-data">Dados dos itens</label>
      <textarea id="raw-data" spellcheck="false" placeholder="Miner details open 1&#10;Crystal Miner&#10;Size: 2x2&#10;Power: 150 TH/s&#10;Bonus: +12%&#10;Quantity: 3&#10;Can be sold&#10;&#10;Miner details open&#10;Solar Miner&#10;...&#10;Can´t be sold"></textarea>

      <div class="action-row">
        <p id="helper">Cole um ou mais blocos para começar.</p>
        <button id="calculate" type="button">
          <span>Calcular</span>
          <span aria-hidden="true">→</span>
        </button>
      </div>
      <div id="message" class="message" role="status" aria-live="polite"></div>
    </section>

    <section id="results" class="results" aria-labelledby="results-title" hidden>
      <div class="results-heading">
        <div>
          <p class="eyebrow">RESULTADO</p>
          <h2 id="results-title">Itens encontrados</h2>
        </div>
        <span id="count" class="count"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th scope="col" aria-sort="none"><button class="sort-button" type="button" data-sort-field="name" data-sort-label="Nome" aria-label="Ordenar por Nome em ordem crescente"><span>Nome</span><span class="sort-arrow" aria-hidden="true">↕</span></button></th>
              <th scope="col" aria-sort="none"><button class="sort-button" type="button" data-sort-field="size" data-sort-label="Size" aria-label="Ordenar por Size em ordem crescente"><span>Size</span><span class="sort-arrow" aria-hidden="true">↕</span></button></th>
              <th scope="col" aria-sort="none"><button class="sort-button" type="button" data-sort-field="power" data-sort-label="Power" aria-label="Ordenar por Power em ordem crescente"><span>Power</span><span class="sort-arrow" aria-hidden="true">↕</span></button></th>
              <th scope="col" aria-sort="none"><button class="sort-button" type="button" data-sort-field="bonus" data-sort-label="Bonus" aria-label="Ordenar por Bonus em ordem crescente"><span>Bonus</span><span class="sort-arrow" aria-hidden="true">↕</span></button></th>
              <th scope="col" aria-sort="none"><button class="sort-button" type="button" data-sort-field="quantity" data-sort-label="Quantidade" aria-label="Ordenar por Quantidade em ordem crescente"><span>Quantidade</span><span class="sort-arrow" aria-hidden="true">↕</span></button></th>
              <th scope="col" aria-sort="none"><button class="sort-button" type="button" data-sort-field="sellable" data-sort-label="Pode ser vendido" aria-label="Ordenar por Pode ser vendido em ordem crescente"><span>Pode ser vendido</span><span class="sort-arrow" aria-hidden="true">↕</span></button></th>
            </tr>
          </thead>
          <tbody id="items-body"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="./app.js?v=7"></script>
</body>
</html>
